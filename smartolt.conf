server {
    listen 80;
    server_name 103.68.214.225.sslip.io;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 103.68.214.225.sslip.io;

    ssl_certificate /etc/letsencrypt/live/103.68.214.225.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/103.68.214.225.sslip.io/privkey.pem;

    # Proxy ke aplikasi Next.js (Port 3009)
    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Proxy ke WebSocket Terminal Server (Port 3010)
    location /ws {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
